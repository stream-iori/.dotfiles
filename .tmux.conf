#-- bindkeys --#
set -g prefix ^x
unbind ^b
bind-key ^t send-prefix

set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

#-- base settings --#
set -g default-terminal "screen-256color"
if-shell "test -f ~/.config/.tmuxBarColor" "source ~/.config/.tmuxBarColor"

set -g display-time 3000
set -g escape-time 0
set -g history-limit 65535
set -g base-index 1
set -g pane-base-index 1
set-option -g default-command "reattach-to-user-namespace -l zsh"

bind R source-file ~/.tmux.conf \; display "Configuration reloaded!"
# enable vi mode
set-window-option -g mode-keys vi

# vi copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy" 

# navigate panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane
bind -r ^k resizep -U 1 # upward (prefix Ctrl+k)
bind -r ^j resizep -D 1 # downward (prefix Ctrl+j)
bind -r ^h resizep -L 1 # to the left (prefix Ctrl+h)
bind -r ^l resizep -R 1 # to the right (prefix Ctrl+l)
	
# key bindings for horizontal and vertical panes
unbind %
bind | split-window -h      
unbind '"'
bind - split-window -v      

bind 0 killp
### rename session
#unbind $
bind r command-prompt -I "rename-session #S"

