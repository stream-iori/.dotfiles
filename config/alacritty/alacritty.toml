# ------------------------------------------------------------------------------
# 1. General & Window
# ------------------------------------------------------------------------------
[general]
live_config_reload = true

[window]
decorations = "buttonless"
dynamic_padding = true
opacity = 0.98
option_as_alt = "Both"
startup_mode = "Windowed"

[window.dimensions]
columns = 100
lines = 85

[window.padding]
x = 10
y = 10

# ------------------------------------------------------------------------------
# 2. Font & Cursor
# ------------------------------------------------------------------------------
[font]
size = 17.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 1

[cursor]
style = "Block"
blink_interval = 750

# ------------------------------------------------------------------------------
# 3. Environment & Scrolling
# ------------------------------------------------------------------------------
[env]
TERM = "alacritty"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

# ------------------------------------------------------------------------------
# 4. Colors (Catppuccin Macchiato)
# ------------------------------------------------------------------------------
[colors.primary]
background = "#24273A"
foreground = "#CAD3F5"
dim_foreground = "#CAD3F5"
bright_foreground = "#CAD3F5"

[colors.cursor]
text = "#24273A"
cursor = "#F4DBD6"

[colors.selection]
text = "#24273A"
background = "#F4DBD6"

[colors.normal]
black = "#494D64"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#B8C0E0"

[colors.bright]
black = "#5B6078"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#A5ADCB"

[colors.dim]
black = "#494D64"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#B8C0E0"

[[colors.indexed_colors]]
index = 16
color = "#F5A97F"

[[colors.indexed_colors]]
index = 17
color = "#F4DBD6"

# ------------------------------------------------------------------------------
# 5. Keyboard Bindings
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
chars = "\u000d" # Force Ctrl+Enter to be standard Return
