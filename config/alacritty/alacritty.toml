# ------------------------------------------------------------------------------
# 1. General & Window
# ------------------------------------------------------------------------------
[general]
live_config_reload = true

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 0.98
blur = true
option_as_alt = "Both"
startup_mode = "Windowed"

[window.dimensions]
columns = 100
lines = 85

[window.padding]
x = 10
y = 10

# ------------------------------------------------------------------------------
# 2. Font & Cursor
# ------------------------------------------------------------------------------
[font]
size = 17.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[cursor]
style = "Block"
blink_interval = 750
unfocused_hollow = true

# ------------------------------------------------------------------------------
# 3. Environment, Scrolling & Mouse
# ------------------------------------------------------------------------------
[env]
TERM = "alacritty"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# ------------------------------------------------------------------------------
# 4. Hints
# ------------------------------------------------------------------------------
[[hints.enabled]]
command = "open" # macOS open command
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "U", mods = "Command|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|ftp:|ftps:|news:|file:|git:|ssh:|itms-services:|afp:|smb:|nfs:|rsync:|telnet:|rtsp:|svn:|git\\+ssh:|x-man-page:|ts3server:|utls:|vnc:|yandexdisk:|ed2k:|irc:|ircs:|git\\+https:|tel:|mumble:|ssh:|svn\\+ssh:|sftp:|vnc:|x-man-page:)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"

# ------------------------------------------------------------------------------
# 5. Colors (Catppuccin Macchiato)
# ------------------------------------------------------------------------------
[colors.primary]
background = "#24273A"
foreground = "#CAD3F5"
dim_foreground = "#CAD3F5"
bright_foreground = "#CAD3F5"

[colors.cursor]
text = "#24273A"
cursor = "#F4DBD6"

[colors.selection]
text = "#24273A"
background = "#F4DBD6"

[colors.normal]
black = "#494D64"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#B8C0E0"

[colors.bright]
black = "#5B6078"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#A5ADCB"

[colors.dim]
black = "#494D64"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
white = "#B8C0E0"

[[colors.indexed_colors]]
index = 16
color = "#F5A97F"

[[colors.indexed_colors]]
index = 17
color = "#F4DBD6"

# ------------------------------------------------------------------------------
# 6. Keyboard Bindings
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "F"
mods = "Command"
action = "SearchForward"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
chars = "\u000d" # Force Ctrl+Enter to be standard Return
